---
layout: default
---

<div class="post-header">
  {% if page.date %}<small class="post-date">{{ page.date | date: "%B %d, %Y" }}</small>{% endif %}
  <h1>{{ page.title }}</h1>
</div>

{{ content }}

{% if page.tags %}

  <small class="post-tags">tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>

{% endif %}
